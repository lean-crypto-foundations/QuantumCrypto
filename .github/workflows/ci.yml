name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # QuantumFoundations is a path dependency (../QuantumFoundations); until its pull
      # request #15 is merged, the finite-type index is on the branch fintype-index.
      - name: QuantumFoundations beside the checkout
        run: git clone --depth 1 --branch fintype-index
          https://github.com/lean-crypto-foundations/QuantumFoundations ../QuantumFoundations
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"
      - name: Standard axioms only (a sorry shows up as sorryAx)
        run: lake env lean scripts/CheckAxioms.lean
